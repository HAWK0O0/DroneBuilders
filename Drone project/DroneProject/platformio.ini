; ============================================================================
; 无人机飞行控制系统 - PlatformIO配置
; https://docs.platformio.org/page/projectconf.html
; ============================================================================

; ============================================================================
; 硬件环境配置
; ============================================================================
[env:uno]
; 硬件平台
platform = atmelavr           ; AVR微控制器平台
board = uno                   ; Arduino Uno开发板
framework = arduino           ; Arduino框架库

; 编译选项
lib_ldf_mode = deep+          ; 深度搜索模式，找到所有依赖
monitor_speed = 115200        ; 串行监视器波特率

; ============================================================================
; 项目依赖库
; ============================================================================
lib_deps =
  mikalhart/TinyGPSPlus       ; GPS数据解析库
  adafruit/Adafruit BNO055    ; BNO055 9轴传感器库(加速度计+陀螺仪+磁力计)
  adafruit/Adafruit Unified Sensor  ; Adafruit统一传感器库
  SPI                         ; SPI串行接口库

; ============================================================================
; 全局项目设置
; ============================================================================
[platformio]
build_dir = C:/Users/darkh/.platformio/build/dron    ; 构建输出目录
libdeps_dir = C:/Users/darkh/.platformio/libdeps      ; 库依赖目录
